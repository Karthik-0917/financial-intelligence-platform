services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - api-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: backend
    environment:
      APP_ENV: production
      AI_SERVICE_URL: http://ai-service:8001
      DATA_DIR: /app/data
      INDEX_DIR: /app/indexes
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results:ro
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - api-network
      - rag-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: ai-service
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      INDEX_DIR: /app/indexes
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./data:/app/data
      - ./indexes:/app/indexes:ro
      - ./models/huggingface:/models/huggingface:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network
      - provider-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  api-network:
    internal: true
  rag-network:
    internal: true
  provider-network:
    driver: bridge