name: Offline quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks and network-blocked tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GROQ_API_KEY: ""
      LLM_PROVIDER: groq
      ENABLE_LLM_FALLBACK: "false"
      SEC_CONTACT_EMAIL: ""
      SEC_USER_AGENT: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m black --check .

      - name: Run offline tests
        run: >
          python -m pytest -q
          --disable-socket
          --allow-unix-socket
          --junitxml="${{ runner.temp }}/financial-tests.xml"

  frontend:
    name: TypeScript and production frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build