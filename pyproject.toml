[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "groq>=0.31.0,<1",
    "pydantic-settings>=2.7,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pymupdf>=1.25,<2",
    "numpy>=2,<3",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.4,<6",
    "faiss-cpu>=1.10,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
    "black>=25,<27",
    "faiss-cpu>=1.10,<2",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "ingestion*",
    "ai_service*",
    "backend*",
    "evaluation*",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]